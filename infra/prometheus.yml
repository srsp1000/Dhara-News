          - 'agent-web-crawler:9100'
          - 'agent-rss-feed:9100'
          - 'agent-fingerprint:9100'
          - 'agent-semantic-dedup:9100'
          - 'agent-story-cluster:9100'
          - 'agent-claim-extraction:9100'
          - 'agent-cross-reference:9100'
          - 'agent-source-credibility:9100'
          - 'agent-truth-score:9100'
          - 'agent-contradiction:9100'
          - 'agent-satire:9100'
          - 'agent-fake-signal:9100'
          - 'agent-entity-extraction:9100'
          - 'agent-topic-classifier:9100'
          - 'agent-summarization:9100'
          - 'agent-rewrite:9100'
          - 'agent-headline:9100'
          - 'agent-translation:9100'
          - 'agent-terminology:9100'
          - 'agent-exam-tagger:9100'
          - 'agent-story-timeline:9100'
          - 'agent-profession-feed:9100'
          - 'agent-location-feed:9100'
          - 'agent-trending:9100'
          - 'agent-morning-brief:9100'
          - 'agent-notification:9100'
          - 'agent-reading-depth:9100'
          - 'agent-search-indexer:9100'
          - 'agent-publish-queue:9100'
          - 'agent-seo:9100'
          - 'agent-social-share:9100'
          - 'agent-truth-updater:9100'
          - 'agent-pipeline-health:9100'
          - 'agent-bias-drift:9100'
          - 'agent-ad-quality:9100'

  # - job_name: 'dhara-api'
  #   static_configs:
  #     - targets: ['api:8000']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']
