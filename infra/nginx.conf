worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # ── Rate limiting ────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=search:10m rate=30r/m;

    # ── Cache ────────────────────────────────────────────────────
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=dhara_cache:10m
                     max_size=1g inactive=60m use_temp_path=off;

    # ── Upstream servers ─────────────────────────────────────────
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream frontend_backend {
        server frontend:3000;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────
    server {
        listen 80;
        server_name dhara.news www.dhara.news;
        return 301 https://$host$request_uri;
    }

    # ── Main server ──────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name dhara.news www.dhara.news;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        # ── API routes ───────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache GET feed/article requests
            proxy_cache dhara_cache;
            proxy_cache_methods GET;
            proxy_cache_valid 200 5m;
            proxy_cache_bypass $http_authorization;
            proxy_no_cache $http_authorization;
            add_header X-Cache-Status $upstream_cache_status;

            # Don't cache write operations
            location ~ ^/api/(save|view|profile|depth-pref) {
                proxy_pass http://api_backend;
                proxy_no_cache 1;
                proxy_cache_bypass 1;
            }
        }

        # ── Search (stricter rate limit) ─────────────────────────
        location /api/search {
            limit_req zone=search burst=10 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_cache dhara_cache;
            proxy_cache_valid 200 2m;
        }

        # ── Frontend (Next.js) ───────────────────────────────────
        location / {
            proxy_pass http://frontend_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Cache static Next.js assets aggressively
            location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
                proxy_pass http://frontend_backend;
                proxy_cache dhara_cache;
                proxy_cache_valid 200 7d;
                add_header Cache-Control "public, max-age=604800, immutable";
            }
        }

        # ── Health check endpoint ────────────────────────────────
        location /health {
            proxy_pass http://api_backend/;
            access_log off;
        }
    }
}
