# docker-compose.prod.yml
# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  # ── API: production settings ────────────────────────────────
  api:
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4 --no-reload
    environment:
      - PYTHONOPTIMIZE=1
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  # ── Frontend: built static output (not dev server) ──────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    command: node server.js
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # ── Elasticsearch: production memory ───────────────────────
  elasticsearch:
    environment:
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"

  # ── Redis: enable persistence ───────────────────────────────
  redis:
    command: redis-server --appendonly yes --save 60 1000 --maxmemory 512mb --maxmemory-policy allkeys-lru

  # ── Nginx: reverse proxy + SSL termination ──────────────────
  nginx:
    image: nginx:alpine
    container_name: dhara_nginx
    networks: [dhara]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on: [api, frontend]
    restart: always

volumes:
  nginx_cache:
