    volumes: ["./agents:/app/agents"]
    command: python -m monitoring.pipeline_health
    restart: unless-stopped

  agent-bias-drift:
    build: {context: ., dockerfile: ./agents/Dockerfile}
    container_name: dhara_agent_bias
    networks: [dhara]
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}}
    volumes: ["./agents:/app/agents"]
    command: python -m monitoring.bias_drift
    restart: unless-stopped

  agent-ad-quality:
    build: {context: ., dockerfile: ./agents/Dockerfile}
    container_name: dhara_agent_ads
    networks: [dhara]
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}}
    volumes: ["./agents:/app/agents"]
    command: python -m monitoring.ad_quality
    restart: unless-stopped

  agent-breaking-news:
    build: {context: ., dockerfile: ./agents/Dockerfile}
    container_name: dhara_agent_breaking
    networks: [dhara]
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    volumes: ["./agents:/app/agents"]
    command: python -m monitoring.breaking_news_detector
    restart: unless-stopped

  # ── FRONTEND ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: dhara_frontend
    networks: [dhara]
    environment:
      # NEXT_PUBLIC_* vars are baked into the browser bundle at build time
      # They must point to where the browser can reach the API (host machine)
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # INTERNAL_API_URL is used by Next.js server components running inside the container
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NODE_ENV: development
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      WATCHPACK_POLLING: "true"
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules", "/app/.next"]
    depends_on: [api]
    command: npm run dev

